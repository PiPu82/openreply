name: Build & Push Images

# Baut die beiden Container-Images in GitHub Actions statt auf dem Server.
# Der Next.js-Build zieht in der Spitze 1–1,5 GB — das wuerde die Produktions-
# kiste ins Swapping treiben. Der Server macht nur noch `docker compose pull`.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile.web
          - component: worker
            dockerfile: Dockerfile.worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build und Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-Cache liegt bei GitHub, getrennt je Komponente
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Ausgabe
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "Gepusht ($COMPONENT):"
          echo "$TAGS"
